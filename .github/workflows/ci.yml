name: ORI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
          python -c "import winrt.windows.foundation; import winrt.windows.foundation.collections; from winrt.windows.devices.geolocation import Geolocator; assert callable(Geolocator.request_access_async)"
      - name: Validate Windows update helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "core/apply_update.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
      - name: Compile Python sources
        run: python scripts/compile_sources.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Validate PowerShell updater scripts
        shell: pwsh
        run: |
          $paths = @(
            "core/apply_update.ps1",
            "core/install_update.ps1",
            "core/uninstall_launcher.ps1",
            "scripts/bootstrap_update.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $path"
            }
            Write-Host "PowerShell syntax valid: $path"
          }
      - name: Ruff correctness checks
        run: python -m ruff check --select F821,F822,F823,F811 main.py ui.py core actions memory dashboard tests

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-package:
    needs: [tests, secret-scan]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build packaged Windows application
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Verify packaged Phone Remote assets
        shell: pwsh
        run: |
          $required = @(
            "dist/ORI/ORI.exe",
            "dist/ORI/core/apply_update.ps1",
            "dist/ORI/core/install_update.ps1",
            "dist/ORI/core/uninstall_launcher.ps1",
            "dist/ORI/core/app_paths.py",
            "dist/ORI/core/crash_diagnostics.py",
            "dist/ORI/dashboard/static/app.html",
            "dist/ORI/dashboard/static/login.html",
            "dist/ORI/dashboard/static/crypto-js.js",
            "dist/ORI/dashboard/static/crypto-js-LICENSE.txt",
            "dist/ORI/config/microphone-on.svg",
            "dist/ORI/config/microphone-muted.svg",
            "dist/ORI/config/voice-stop.svg",
            "dist/ORI/config/api_keys.example.json",
            "dist/ORI/winrt/windows/foundation/__init__.py",
            "dist/ORI/winrt/windows/foundation/collections/__init__.py"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Windows package is missing required file: $path" }
          }
          if (Test-Path "dist/ORI/config/api_keys.json") {
            throw "The installer package must not contain a user API config."
          }
          $env:ORI_PACKAGE_ROOT = (Resolve-Path "dist/ORI").Path
          python -I -c "import os, sys; root=os.environ['ORI_PACKAGE_ROOT']; os.add_dll_directory(root); sys.path.insert(0, root); import winrt.windows.foundation; import winrt.windows.foundation.collections; from winrt.windows.devices.geolocation import Geolocator; assert callable(Geolocator.request_access_async)"
          if ($LASTEXITCODE -ne 0) { throw "Frozen package WinRT location imports failed." }
          choco install innosetup --yes --no-progress
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw "Inno Setup ISCC.exe was not found after installation." }
          $version = (python -c "from ori_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or !$version) { throw "Could not read ORI APP_VERSION." }
          & $compiler.FullName "/DMyAppVersion=$version" "installer\ORI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
          $installer = "dist/installer/ORI-Setup-$version.exe"
          if (!(Test-Path $installer)) { throw "ORI Setup.exe was not created: $installer" }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ORI-Setup-$version.exe" | Set-Content -Encoding ascii "$installer.sha256"

          # Full in-place upgrade test: install the published 3.6.0 Setup, then
          # run the exact detached helper used by the installed application's updater.
          $upgradeInstall = Join-Path $env:LOCALAPPDATA "Programs\ORI"
          $previousSetup = Join-Path $env:RUNNER_TEMP "ORI-Setup-3.6.0.exe"
          $previousChecksum = "$previousSetup.sha256"
          $previousBase = "https://github.com/saamad705241-cyber/ORI-Desktop/releases/download/v3.6.0/ORI-Setup-3.6.0.exe"
          Invoke-WebRequest -Uri $previousBase -OutFile $previousSetup -UseBasicParsing
          Invoke-WebRequest -Uri "$previousBase.sha256" -OutFile $previousChecksum -UseBasicParsing
          $expectedHash = [regex]::Match((Get-Content -LiteralPath $previousChecksum -Raw), "[A-Fa-f0-9]{64}")
          if (!$expectedHash.Success) { throw "Published v3.6.0 checksum asset is invalid." }
          $actualHash = (Get-FileHash -LiteralPath $previousSetup -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash.Value) { throw "Published v3.6.0 Setup checksum verification failed." }

          $oldSetup = Start-Process -FilePath $previousSetup -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/DIR=`"$upgradeInstall`""
          ) -Wait -PassThru
          if ($oldSetup.ExitCode -ne 0) { throw "Published v3.6.0 Setup exited with code $($oldSetup.ExitCode)." }
          foreach ($requiredFile in @("ORI.exe", "unins000.exe", "python312.dll")) {
            if (!(Test-Path (Join-Path $upgradeInstall $requiredFile))) {
              throw "The v3.6.0 install is missing required file: $requiredFile"
            }
          }

          $userData = Join-Path $env:LOCALAPPDATA "ORI"
          $updateSentinel = Join-Path $userData "memory\ci-update-preservation.txt"
          New-Item -ItemType Directory -Path (Split-Path -Parent $updateSentinel) -Force | Out-Null
          "keep-user-data-through-update" | Set-Content -Encoding utf8 $updateSentinel
          $helperPath = (Resolve-Path "core/install_update.ps1").Path
          $installerPath = (Resolve-Path $installer).Path
          $updateLog = Join-Path $env:RUNNER_TEMP "ORI-3.6.0-to-$version-update.log"
          $rollbackDir = Join-Path $env:RUNNER_TEMP "ORI-3.6.0-rollback"
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $helperPath -AppPid -1 -InstallerPath $installerPath -InstallDir $upgradeInstall -LogPath $updateLog -RollbackDir $rollbackDir
          if ($LASTEXITCODE -ne 0) { throw "The real in-place update helper failed. Log: $updateLog" }
          if (!(Select-String -LiteralPath $updateLog -Pattern "UPDATE SUCCESS" -Quiet)) {
            throw "The update helper did not confirm its startup/restart check. Log: $updateLog"
          }
          $updatedEntry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "ORI Personal AI Desktop Assistant" } |
            Select-Object -First 1
          if (!$updatedEntry -or $updatedEntry.DisplayVersion -ne $version) {
            throw "In-place upgrade did not register ORI version $version."
          }
          if (!(Test-Path $updateSentinel)) { throw "The in-place update removed existing user data." }
          $updatedProcesses = Get-Process -Name ORI -ErrorAction SilentlyContinue
          if (!$updatedProcesses) { throw "Updated ORI did not remain running after its startup check." }
          $updatedProcesses | Stop-Process -Force
          Start-Sleep -Seconds 1
          $upgradeUninstall = Start-Process -FilePath (Join-Path $upgradeInstall "unins000.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($upgradeUninstall.ExitCode -ne 0) { throw "Post-update uninstaller exited with code $($upgradeUninstall.ExitCode)." }
          if (Test-Path $upgradeInstall) { throw "Updated ORI program files remain after uninstall." }
          if (!(Test-Path $updateSentinel)) { throw "Uninstall after update removed preserved user data." }
          Remove-Item -LiteralPath $updateSentinel -Force
          Write-Host "ORI 3.6.0 -> $version in-place Setup update, restart marker, rollback-ready helper and user-data preservation verified."

          # Fresh installation and uninstall smoke test remains separate.
          $testInstall = Join-Path $env:RUNNER_TEMP "ORI Installer Smoke"
          $sentinel = Join-Path $userData "memory\ci-uninstall-preservation.txt"
          New-Item -ItemType Directory -Path (Split-Path -Parent $sentinel) -Force | Out-Null
          "keep-user-data" | Set-Content -Encoding utf8 $sentinel
          $setup = Start-Process -FilePath (Resolve-Path $installer).Path -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/DIR=`"$testInstall`""
          ) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "ORI Setup exited with code $($setup.ExitCode)." }
          foreach ($requiredFile in @("ORI.exe", "unins000.exe", "python312.dll")) {
            if (!(Test-Path (Join-Path $testInstall $requiredFile))) {
              throw "Installed ORI is missing required file: $requiredFile"
            }
          }
          $uninstallEntry = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "ORI Personal AI Desktop Assistant" } |
            Select-Object -First 1
          if (!$uninstallEntry) { throw "ORI Windows uninstall entry was not registered." }
          $uninstall = Start-Process -FilePath (Join-Path $testInstall "unins000.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "ORI uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path $testInstall) { throw "ORI program files remain after uninstall." }
          if (!(Test-Path $sentinel)) { throw "ORI uninstall removed user data under LocalAppData." }
          Remove-Item -LiteralPath $sentinel -Force
          Write-Host "ORI $version fresh Setup install, bundled runtime, uninstall entry and data-preserving uninstall verified."

      - uses: actions/upload-artifact@v4
        with:
          name: ORI-Windows-Package-${{ github.sha }}
          path: |
            dist/ORI/
            dist/installer/ORI-Setup-*.exe
            dist/installer/ORI-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 3
