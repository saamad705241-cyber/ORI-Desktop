name: ORI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Compile Python sources
        run: python scripts/compile_sources.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Ruff correctness checks
        run: python -m ruff check --select F821,F822,F823,F811 main.py ui.py core actions memory dashboard tests

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-package:
    needs: [tests, secret-scan]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build packaged Windows application
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Verify packaged Phone Remote assets
        shell: pwsh
        run: |
          $required = @(
            "dist/ORI/ORI.exe",
            "dist/ORI/dashboard/static/app.html",
            "dist/ORI/dashboard/static/login.html",
            "dist/ORI/dashboard/static/crypto-js.js",
            "dist/ORI/dashboard/static/crypto-js-LICENSE.txt"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Windows package is missing required file: $path" }
          }
          Write-Host "Windows package and Phone Remote assets verified."
      - uses: actions/upload-artifact@v4
        with:
          name: ORI-Windows-Package-${{ github.sha }}
          path: dist/ORI/
          if-no-files-found: error
          retention-days: 3
