name: Build ORI 3.6.7 Installer from Uploaded Source ZIP

on:
  push:
    branches: [main]
    paths:
      - "ORI365_SAFE.zip"
      - ".github/workflows/build-uploaded-source.yml"
      - "scripts/apply_quality_fixes.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ori-source-zip-installer
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Extract the uploaded ORI 3.6.7 source ZIP
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "ORI365_SAFE.zip"
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "ORI365_SAFE.zip was not found in the repository root."
          }
          $destination = Join-Path $env:RUNNER_TEMP "ori-source"
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $source = Join-Path $destination "ORI-3.6.5-Source-Publishing-SAFE"
          if (!(Test-Path (Join-Path $source "ori_metadata.py"))) {
            throw "The uploaded ZIP does not contain the expected ORI source root."
          }
          # Apply a reviewed one-line correctness fix from the uploaded source:
          # _run_proactive_mode must obtain its running event loop locally.
          $mainPath = Join-Path $source "main.py"
          $mainText = [System.IO.File]::ReadAllText($mainPath)
          $oldCode = "monitors     = await loop.run_in_executor(self._tool_executor, list_monitors)"
          $newCode = "monitors     = await asyncio.get_running_loop().run_in_executor(self._tool_executor, list_monitors)"
          if (!$mainText.Contains($oldCode)) {
            throw "Expected proactive-mode loop reference was not found; refusing to patch an unknown source version."
          }
          $mainText = $mainText.Replace($oldCode, $newCode)
          [System.IO.File]::WriteAllText($mainPath, $mainText, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Applied proactive-mode event loop correction to the extracted source."

          foreach ($relative in @("core/install_update.ps1", "core/update_assistant.ps1", "installer/ORI.iss")) {
            $full = Join-Path $source $relative
            Write-Host ("=== SOURCE SCRIPT DIAGNOSTICS " + $relative + " ===")
            if (Test-Path -LiteralPath $full) {
              Select-String -LiteralPath $full -Pattern "AppPid|Wait-Process|Start-Process|InstallerPath|VERYSILENT|NoDialog|NoLaunch|Preparing protected|Installing ORI|^\[Run\]|Launch ORI|backup|Backup" -Context 2,5 |
                Select-Object -First 100 | ForEach-Object {
                  Write-Host ("SCRIPT-LINE " + $_.LineNumber + ": " + $_.Line.Trim())
                  $_.Context.PostContext | ForEach-Object { Write-Host ("  " + $_.Trim()) }
                }
            }
          }



          python (Join-Path $env:GITHUB_WORKSPACE "scripts/apply_quality_fixes.py") $source
          if ($LASTEXITCODE -ne 0) { throw "ORI quality fixes could not be applied." }
          $workflowDest = Join-Path $source ".github/workflows"
          New-Item -ItemType Directory -Path $workflowDest -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".github/workflows/ci.yml") -Destination $workflowDest
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".github/workflows/release.yml") -Destination $workflowDest
          Write-Host "Applied quality fixes and restored repository workflow fixtures for source tests."
          $version = (& python -c "import ast,pathlib; t=ast.parse(pathlib.Path(r'$source/ori_metadata.py').read_text(encoding='utf-8')); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "3.6.7") {
            throw "Expected source version 3.6.7, found '$version'."
          }
          $updater = Get-Content -LiteralPath (Join-Path $source "core/app_updater.py") -Raw
          if ($updater -notmatch 'DEFAULT_REPOSITORY\s*=\s*"saamad705241-cyber/ORI-Desktop"') {
            throw "The in-app updater is not configured for the official ORI-Desktop repository."
          }
          "ORI_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated uploaded ORI source version $version at $source"

      - name: Confirm extracted source is the build source
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          $version = (python -c "from ori_metadata import APP_VERSION; print(APP_VERSION)").Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "3.6.7") {
            throw "Build directory is not the expected ORI 3.6.7 extracted source. Found '$version'."
          }
          Write-Host "Building source version $version from the uploaded ZIP."

      - name: Install project and test dependencies
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest ruff

      - name: Compile sources and run automated tests
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          python scripts/compile_sources.py
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed." }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw "ORI automated tests failed." }
          python -m ruff check --select F821,F822,F823,F811 main.py ui.py core actions memory dashboard tests
          if ($LASTEXITCODE -ne 0) { throw "ORI Ruff correctness checks failed." }

      - name: Build bundled Windows application
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          ./scripts/build_release.ps1
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller Windows bundle build failed." }
          foreach ($file in @("dist/ORI/ORI.exe", "dist/ORI/python312.dll", "dist/ORI/core/app_updater.py", "dist/ORI/core/update_assistant.ps1", "dist/ORI/core/install_update.ps1")) {
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Packaged application is missing required file: $file"
            }
          }
          if (Test-Path "dist/ORI/config/api_keys.json") {
            throw "A private API configuration must not be included in the installer."
          }

      - name: Sign ORI application executable when certificate is configured
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        env:
          ORI_SIGNING_PFX_BASE64: ${{ secrets.ORI_SIGNING_PFX_BASE64 }}
          ORI_SIGNING_PFX_PASSWORD: ${{ secrets.ORI_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = ![string]::IsNullOrWhiteSpace($env:ORI_SIGNING_PFX_BASE64)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:ORI_SIGNING_PFX_PASSWORD)
          if (!$hasCertificate -and !$hasPassword) {
            Write-Warning "No Authenticode certificate is configured. Continuing with an UNSIGNED QA/publication build; Windows SmartScreen may show its warning."
            "ORI_SIGNING_STATUS=unsigned (SmartScreen warning possible)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }
          if (!$hasCertificate -or !$hasPassword) { throw "Both ORI_SIGNING_PFX_BASE64 and ORI_SIGNING_PFX_PASSWORD must be configured together." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "ori-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:ORI_SIGNING_PFX_BASE64))
            $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signTool) { throw "Windows SDK signtool.exe was not found on the runner." }
            $app = "dist/ORI/ORI.exe"
            if (!(Test-Path -LiteralPath $app -PathType Leaf)) { throw "ORI.exe is missing before signing." }
            & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $env:ORI_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $app
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing of ORI.exe failed." }
            & $signTool.FullName verify /pa /all /v $app
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification of ORI.exe failed." }
            "ORI_SIGNING_STATUS=signed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "ORI.exe is digitally signed and its Authenticode signature is verified."
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Install Inno Setup and compile final installer
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Could not install Inno Setup on the Windows runner." }
          $compiler = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$compiler) { throw "Inno Setup compiler ISCC.exe was not found." }
          & $compiler.FullName "/DMyAppVersion=3.6.7" "installer\ORI.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installer compilation failed." }
          $installer = "dist/installer/ORI-Setup-3.6.7.exe"
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Final ORI Setup EXE was not created." }
          Write-Host "Created ORI-Setup-3.6.7.exe; Authenticode signing is the next required step."

      - name: Sign and verify final installer when certificate is configured
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        env:
          ORI_SIGNING_PFX_BASE64: ${{ secrets.ORI_SIGNING_PFX_BASE64 }}
          ORI_SIGNING_PFX_PASSWORD: ${{ secrets.ORI_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $hasCertificate = ![string]::IsNullOrWhiteSpace($env:ORI_SIGNING_PFX_BASE64)
          $hasPassword = ![string]::IsNullOrWhiteSpace($env:ORI_SIGNING_PFX_PASSWORD)
          if (!$hasCertificate -and !$hasPassword) {
            Write-Warning "Publishing unsigned ORI Setup so existing installations can test the in-app updater. SmartScreen may display its warning."
            exit 0
          }
          if (!$hasCertificate -or !$hasPassword) { throw "Both ORI_SIGNING_PFX_BASE64 and ORI_SIGNING_PFX_PASSWORD must be configured together." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "ori-code-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:ORI_SIGNING_PFX_BASE64))
            $signTool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (!$signTool) { throw "Windows SDK signtool.exe was not found on the runner." }
            $installer = "dist/installer/ORI-Setup-3.6.7.exe"
            if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw "The final installer is missing." }
            & $signTool.FullName sign /fd SHA256 /f $pfxPath /p $env:ORI_SIGNING_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing of ORI Setup failed." }
            & $signTool.FullName verify /pa /all /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification of ORI Setup failed." }
            Write-Host "ORI Setup is digitally signed and its Authenticode signature is verified."
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }

      - name: Create checksum for final installer after optional signing
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          $installer = "dist/installer/ORI-Setup-3.6.7.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ORI-Setup-3.6.7.exe" | Set-Content -Encoding ascii "dist/installer/ORI-Setup-3.6.7.exe.sha256"
          Write-Host "Created SHA-256 checksum after Authenticode signing."

      - name: Smoke-test the installer on Windows
        shell: pwsh
        working-directory: ${{ runner.temp }}/ori-source/ORI-3.6.5-Source-Publishing-SAFE
        run: |
          $installer = (Resolve-Path "dist/installer/ORI-Setup-3.6.7.exe").Path
          $testDir = Join-Path $env:RUNNER_TEMP "ORI-3.6.7-Installer-Smoke"
          $install = Start-Process -FilePath $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/DIR=`"$testDir`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer smoke test exited with code $($install.ExitCode)." }
          foreach ($name in @("ORI.exe", "python312.dll", "unins000.exe")) {
            if (!(Test-Path (Join-Path $testDir $name))) { throw "Installed app is missing $name." }
          }
          $uninstall = Start-Process -FilePath (Join-Path $testDir "unins000.exe") -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Installer smoke-test uninstall exited with code $($uninstall.ExitCode)." }
          if (Test-Path $testDir) { throw "Installer smoke-test files remain after uninstall." }
          Write-Host "Installer install/uninstall smoke test passed."

      - name: Prepare release assets
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:ORI_SOURCE "dist/installer/ORI-Setup-3.6.7.exe") -Destination $out
          Copy-Item -LiteralPath (Join-Path $env:ORI_SOURCE "dist/installer/ORI-Setup-3.6.7.exe.sha256") -Destination $out

      - name: Upload installer build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORI-3.6.7-Windows-Installer
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish ORI v3.6.7 GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.6.7
          target_commitish: ${{ github.sha }}
          name: ORI v3.6.7
          body: |
            Windows installer built directly from the uploaded ORI 3.6.7 source archive.

            The Setup bundles the Python runtime and application dependencies. Users do not need to install Python, Java, or Node.js separately.

            Includes the in-app GitHub updater, SHA-256 verification, visible Update Assistant, post-install launch verification, and rollback helper.

            Build applies a reviewed proactive-mode event-loop correctness fix before tests and packaging.
          make_latest: true
          prerelease: false
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/ORI-Setup-3.6.7.exe
            release-artifacts/ORI-Setup-3.6.7.exe.sha256
