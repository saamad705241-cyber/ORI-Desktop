name: Build ORI Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Compile source and run tests
        run: |
          python scripts/compile_sources.py
          python -m pytest -q
          python -m ruff check --select F821,F822,F823,F811 main.py ui.py core actions memory dashboard tests

  windows-release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies and packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build one-folder Windows app
        shell: pwsh
        run: ./scripts/build_release.ps1
      - name: Create release ZIP and SHA-256 file
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $zip = "ORI-$tag-Windows.zip"
          Compress-Archive -Path "dist/ORI" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content -Encoding ascii "$zip.sha256"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ORI-*-Windows.zip
            ORI-*-Windows.zip.sha256
